spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.docker.compose.enabled=false
spring.flyway.enabled=true

app.jwtSecret=${JWT_SECRET}
app.jwtExpirationMs=${JWT_ACCESS_EXPIRATION:900000}
app.jwtRefreshExpirationMs=${JWT_REFRESH_EXPIRATION:604800000}
app.cookieSecure=${COOKIE_SECURE:true}
app.cookieSameSite=${COOKIE_SAME_SITE:Strict}
app.corsAllowedOrigins=${CORS_ALLOWED_ORIGINS}
app.businessTimeZone=${BUSINESS_TIME_ZONE:Africa/Cairo}
