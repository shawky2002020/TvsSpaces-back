spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:mydatabase}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:myuser}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.docker.compose.enabled=false

app.jwtSecret=${JWT_SECRET:yoursecretkeyyoursecretkeyyoursecretkey}
app.jwtExpirationMs=${JWT_ACCESS_EXPIRATION:900000}
app.jwtRefreshExpirationMs=${JWT_REFRESH_EXPIRATION:604800000}
app.cookieSecure=${COOKIE_SECURE:false}
app.cookieSameSite=${COOKIE_SAME_SITE:Strict}
app.corsAllowedOrigins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
