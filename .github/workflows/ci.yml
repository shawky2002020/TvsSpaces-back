name: Backend CI

on:
  push:
    branches: [main, feature/tvs-functional-e2e]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests and package
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode clean verify

  mysql-api-smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: mydatabase
          MYSQL_USER: myuser
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root-secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-secret"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_NAME: mydatabase
      DB_USERNAME: myuser
      DB_PASSWORD: secret
      DB_DDL_AUTO: validate
      JWT_SECRET: ci-smoke-jwt-secret-ci-smoke-jwt-secret-ci-smoke-jwt-secret-123456
      JWT_ACCESS_EXPIRATION: 900000
      JWT_REFRESH_EXPIRATION: 604800000
      COOKIE_SECURE: 'false'
      COOKIE_SAME_SITE: Strict
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      BUSINESS_TIME_ZONE: Africa/Cairo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Package application
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode -DskipTests package

      - name: Start backend against MySQL
        run: |
          nohup java -jar target/spaces-back-0.0.1-SNAPSHOT.jar \
            --spring.profiles.active=local > app-initial.log 2>&1 &
          echo $! > app.pid
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail http://127.0.0.1:8080/actuator/health; then
              exit 0
            fi
            sleep 2
          done
          cat app-initial.log
          exit 1

      - name: Run authenticated booking smoke flow
        run: python3 .github/scripts/mysql_api_smoke.py initial

      - name: Restart backend without resetting MySQL
        run: |
          kill "$(cat app.pid)"
          wait "$(cat app.pid)" 2>/dev/null || true
          sleep 2
          nohup java -jar target/spaces-back-0.0.1-SNAPSHOT.jar \
            --spring.profiles.active=local > app-restart.log 2>&1 &
          echo $! > app.pid
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail http://127.0.0.1:8080/actuator/health; then
              exit 0
            fi
            sleep 2
          done
          cat app-restart.log
          exit 1

      - name: Verify persistence after backend restart
        run: python3 .github/scripts/mysql_api_smoke.py persistence

      - name: Upload backend logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-api-smoke-logs
          path: |
            app-initial.log
            app-restart.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Clean up smoke process and sensitive state
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill "$(cat app.pid)" 2>/dev/null || true
          fi
          rm -f smoke_state.json
