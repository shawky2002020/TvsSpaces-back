name: Backend CI

on:
  push:
    branches: [main, feature/tvs-functional-e2e]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests and package
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode clean verify
